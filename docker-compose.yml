version: "3.9"

services:
  mysql:
    image: mysql:8
    container_name: mysql_hospital
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hospital_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./BaseSQL:/docker-entrypoint-initdb.d

volumes:
  mysql_data:
